# Construye la AAR del módulo Go (SDK de zrok) y la APK, y firma el release.
name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: AAR del túnel (SDK de zrok)
        run: |
          gomobile bind -target=android -androidapi 26 \
            -o app/libs/viamdm-tunnel.aar ./tunnel

      - name: APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - run: gradle assembleDebug

      - name: Firma del release (si hay keystore en los secretos)
        if: ${{ secrets.APK_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.APK_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > keystore.properties <<PROPS
          storeFile=$(pwd)/release.keystore
          storePassword=${{ secrets.APK_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.APK_KEY_ALIAS }}
          keyPassword=${{ secrets.APK_KEY_PASSWORD }}
          PROPS

      - name: Release
        if: ${{ secrets.APK_KEYSTORE_BASE64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artefacto (debug) en cada push
        uses: actions/upload-artifact@v4
        with:
          name: viamdm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
