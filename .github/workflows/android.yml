# Construye la AAR del módulo Go (SDK de zrok) y la APK, y firma el release si hay keystore.
name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tunnel/go.sum

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: AAR del túnel (SDK de zrok)
        run: |
          mkdir -p app/libs
          gomobile bind -target=android -androidapi 26 \
            -o app/libs/viamdm-tunnel.aar ./tunnel

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar la APK
        run: gradle assembleDebug

      - name: APK de release (solo con keystore en los secretos)
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [ -z "$APK_KEYSTORE_BASE64" ]; then
            echo "Sin keystore: se publica solo el APK de debug."
            exit 0
          fi
          echo "$APK_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<PROPS
          storeFile=$(pwd)/release.keystore
          storePassword=$APK_KEYSTORE_PASSWORD
          keyAlias=$APK_KEY_ALIAS
          keyPassword=$APK_KEY_PASSWORD
          PROPS
          gradle assembleRelease

      - name: Release en GitHub (cuando hay APK firmada)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$APK_KEYSTORE_BASE64" ] || [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Nada que publicar."
            exit 0
          fi
          gh release create v0.1.0 app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --generate-notes --title "ViaMDM v0.1.0" \
            || gh release upload v0.1.0 app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Artefacto de debug en cada push
        uses: actions/upload-artifact@v4
        with:
          name: viamdm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
